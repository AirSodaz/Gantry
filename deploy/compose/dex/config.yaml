issuer: http://gantry-dex.localhost:5556/dex

storage:
  type: sqlite3
  config:
    file: /data/dex.db

web:
  http: 0.0.0.0:5556

frontend:
  dir: /srv/dex/web

logger:
  level: info
  format: json

oauth2:
  responseTypes: [code]
  passwordConnector: local
  skipApprovalScreen: true

enablePasswordDB: true

staticClients:
  - id: gantry-copilot-web
    name: Gantry Copilot
    public: true
    redirectURIs:
      - http://localhost:3002/
      - http://localhost:3002
  - id: gantry-admin-web
    name: Gantry Admin
    public: true
    redirectURIs:
      - http://localhost:3001/
      - http://localhost:3001
  - id: gantry-copilot-api
    name: Gantry Copilot API
    public: true
    trustedPeers:
      - gantry-copilot-web
      - gantry-copilot-smoke
  - id: gantry-admin-api
    name: Gantry Admin API
    public: true
    trustedPeers:
      - gantry-admin-web
      - gantry-admin-smoke
  - id: gantry-copilot-smoke
    name: Gantry Copilot smoke test
    secret: gantry-smoke-secret
  - id: gantry-admin-smoke
    name: Gantry Admin smoke test
    secret: gantry-admin-smoke-secret

staticPasswords:

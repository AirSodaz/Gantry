    username: copilot-demo
    preferredUsername: copilot-demo
    name: Copilot Demo
    emailVerified: true
    userID: 11111111-1111-1111-1111-111111111111
    hash: $2b$10$hTkZWTwWJu3YQi7kWQg8oOD7TAYEeySe.pgu1glKuZy4mVXhoNTzG
  - email: copilot-other@example.test
    username: copilot-other
    preferredUsername: copilot-other
    name: Copilot Other
    emailVerified: true

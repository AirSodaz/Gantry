services:
  dex:
    image: ghcr.io/dexidp/dex:v2.45.1
    container_name: gantry-dex
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "5556:5556"
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
    # Dex runs as UID 1001; a named volume is root-owned on first mount.
    # Local Compose fixtures are disposable, so use a writable in-memory DB.
    tmpfs:
      - /data:uid=1001,gid=1001,mode=0755
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5556/dex/.well-known/openid-configuration"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      default:
        aliases:
          - gantry-dex.localhost
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

  postgres:
    image: postgres:17-alpine
    container_name: gantry-postgres
    environment:
      POSTGRES_USER: gantry
      POSTGRES_PASSWORD: gantry_dev
      POSTGRES_DB: gantry
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gantry"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  minio:
    image: minio/minio:latest
    container_name: gantry-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gantry
      MINIO_ROOT_PASSWORD: gantry_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  control-plane:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.control-plane
    container_name: gantry-control-plane
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      dex:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      GANTRY_DB_HOST: postgres
      GANTRY_DB_PORT: "5432"
      GANTRY_DB_USER: gantry
      GANTRY_DB_PASSWORD: gantry_dev
      GANTRY_DB_NAME: gantry
      GANTRY_S3_ENDPOINT: http://minio:9000
      GANTRY_S3_ACCESS_KEY: gantry
      GANTRY_S3_SECRET_KEY: gantry_dev_secret
      GANTRY_S3_REGION: us-east-1
      GANTRY_S3_USE_PATH_STYLE: "true"
      GANTRY_LOG_LEVEL: debug
      GANTRY_HTTP_PORT: "8080"
      GANTRY_GRPC_PORT: "8081"
      GANTRY_DEVELOPMENT_MODE: "true"
      GANTRY_PHASE0_DEV_API_TOKEN: ${GANTRY_PHASE0_DEV_API_TOKEN:-gantry_phase0_dev_token}
      GANTRY_DEV_CREDENTIAL_FILE: /tmp/gantry-dev-credentials.enc
      GANTRY_DEV_CREDENTIAL_KEY: ${GANTRY_DEV_CREDENTIAL_KEY:-MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
      GANTRY_COPILOT_OIDC_ISSUER: http://gantry-dex.localhost:5556/dex
      GANTRY_COPILOT_OIDC_AUDIENCE: gantry-copilot-api
      GANTRY_ADMIN_OIDC_ISSUER: http://gantry-dex.localhost:5556/dex
      GANTRY_ADMIN_OIDC_AUDIENCE: gantry-admin-api
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - default
      - runner-net

  runner:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.runner
    container_name: gantry-runner
    depends_on:
      control-plane:
        condition: service_healthy
    environment:
      GANTRY_CONTROL_PLANE_ADDR: http://control-plane:8081
      GANTRY_RUNNER_ID: dev-runner-01
      GANTRY_LOG_LEVEL: debug
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    networks:
      - runner-net

networks:
  runner-net:
    driver: bridge
    internal: true

volumes:
  pgdata:
  miniodata:

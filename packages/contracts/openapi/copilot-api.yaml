openapi: "3.1.0"
info:
  title: Gantry Copilot API
  version: "1.0.0"
  description: |
    Employee-facing API for Gantry Copilot. Provides agent discovery,
    task submission, run monitoring, approvals, and artifact access.
  contact:
    name: Gantry Platform Team

servers:
  - url: /api/copilot/v1
    description: Copilot API v1

security:
  - oauth2:
      - copilot

paths:
  /agents:
    get:
      operationId: listPublishedAgents
      summary: List agents published to the current user
      tags: [Agents]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Published agents visible to the employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotAgentList"

  /attachments:
    post:
      operationId: createAttachment
      summary: Create a requester-owned attachment upload grant
      tags: [Attachments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAttachmentRequest"
      responses:
        "201":
          description: Quarantined attachment with a short-lived upload grant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentResponse"

  /attachments/{attachment_id}:
    get:
      operationId: getAttachment
      summary: Get requester-authorized attachment metadata and scan state
      tags: [Attachments]
      parameters:
        - $ref: "#/components/parameters/AttachmentIdParam"
      responses:
        "200":
          description: Attachment metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentResponse"

  /attachments/{attachment_id}/content:
    put:
      operationId: uploadAttachmentContent
      summary: Upload attachment bytes with a short-lived grant
      tags: [Attachments]
      parameters:
        - $ref: "#/components/parameters/AttachmentIdParam"
        - name: X-Gantry-Upload-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Bytes stored in quarantine

  /attachments/{attachment_id}:complete:
    post:
      operationId: completeAttachment
      summary: Validate and complete a quarantined attachment upload
      tags: [Attachments]
      parameters:
        - $ref: "#/components/parameters/AttachmentIdParam"
      responses:
        "200":
          description: Attachment state after validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentResponse"

  /tasks:
    post:
      operationId: submitTask
      summary: Submit a new task
      tags: [Tasks]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitTaskRequest"
      responses:
        "200":
          description: Original task returned for an idempotent retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "201":
          description: Task accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
    get:
      operationId: listMyTasks
      summary: List tasks for the current user
      tags: [Tasks]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: status
          in: query
          schema:
            type: string
        - name: agent_id
          in: query
          schema:
            type: string
        - name: requester_action
          in: query
          schema:
            type: string
            enum: [approval, input]
        - name: created_after
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: List of user's tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"

  /tasks/{task_id}:
    get:
      operationId: getTask
      summary: Get task details
      tags: [Tasks]
      parameters:
        - $ref: "#/components/parameters/TaskIdParam"
      responses:
        "200":
          description: Task details
          headers:
            ETag:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"

  /tasks/{task_id}/messages:
    post:
      operationId: appendTaskMessage
      summary: Add requester input and start the next task run
      tags: [Tasks]
      parameters:
        - $ref: "#/components/parameters/TaskIdParam"
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendTaskMessageRequest"
      responses:
        "200":
          description: Original task returned for an idempotent retry
          headers:
            ETag:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "201":
          description: Follow-up accepted and next run queued
          headers:
            ETag:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"

  /tasks/{task_id}/runs:
    get:
      operationId: listTaskRuns
      summary: List compact run attempts for one task
      tags: [Tasks]
      parameters:
        - $ref: "#/components/parameters/TaskIdParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Requester-authorized run attempt history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunAttemptList"

  /tasks/{task_id}/events:ticket:
    post:
      operationId: createTaskEventsTicket
      summary: Create a short-lived WebSocket event ticket
      tags: [Tasks]
      parameters:
        - $ref: "#/components/parameters/TaskIdParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskEventsTicketRequest"
      responses:
        "200":
          description: Short-lived ticket for the task event stream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskEventsTicket"
        "404":
          description: Task was not found

  /tasks/{task_id}/runs/{run_id}:cancel:
    post:
      operationId: cancelRun
      summary: Cancel a run
      tags: [Tasks]
      parameters:
        - $ref: "#/components/parameters/TaskIdParam"
        - name: run_id
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cancellation accepted or already terminal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunStatus"

  /tasks/{task_id}:retry:
    post:
      operationId: retryTask
      summary: Retry a task
      tags: [Tasks]
      parameters:
        - $ref: "#/components/parameters/TaskIdParam"
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetryTaskRequest"
      responses:
        "201":
          description: New run created
          headers:
            ETag:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"

  /approvals:
    get:
      operationId: listMyApprovals
      summary: List approvals assigned to the current user
      tags: [Approvals]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Pending approvals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotApprovalList"

  /approvals/{approval_id}:decide:
    post:
      operationId: decideApproval
      summary: Approve or reject an action
      tags: [Approvals]
      parameters:
        - name: approval_id
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecisionRequest"
      responses:
        "200":
          description: Requester-authorized approval projection after the decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotApproval"
        "403":
          description: The current principal cannot decide this action
        "404":
          description: Approval request was not found
        "409":
          description: The approval is expired or already decided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalDecisionConflict"
        "412":
          description: The action digest is stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalDecisionConflict"

  /approvals/{approval_id}:
    get:
      operationId: getApproval
      summary: Get requester-authorized approval detail and decision evidence
      tags: [Approvals]
      parameters:
        - name: approval_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approval detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotApproval"
        "404":
          description: Approval request was not found

  /artifacts/{artifact_id}:
    get:
      operationId: getArtifact
      summary: Get artifact metadata
      tags: [Artifacts]
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Artifact metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactResponse"

  /artifacts/{artifact_id}:download:
    post:
      operationId: createArtifactDownloadGrant
      summary: Authorize and issue a short-lived artifact download reference
      tags: [Artifacts]
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Authorized short-lived download reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactDownloadGrant"
        "404":
          description: Artifact was not found
        "409":
          description: Artifact is not available for download

  /artifacts:
    get:
      operationId: listMyArtifacts
      summary: List requester-scoped artifacts across tasks
      tags: [Artifacts]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: task_id
          in: query
          schema:
            type: string
        - name: classification
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Requester-scoped artifact list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactList"

components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          scopes:
            copilot: Employee Copilot access

  parameters:
    CursorParam:
      name: cursor
      in: query
      schema:
        type: string
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    TaskIdParam:
      name: task_id
      in: path
      required: true
      schema:
        type: string
    AttachmentIdParam:
      name: attachment_id
      in: path
      required: true
      schema:
        type: string

  schemas:
    PageInfo:
      type: object
      required: [has_more]
      properties:
        next_cursor:
          type: string
        has_more:
          type: boolean

    Timestamp:
      type: string
      format: date-time

    # --- Agents ---
    CopilotAgent:
      type: object
      required: [id, display_name, description]
      properties:
        id:
          type: string
        display_name:
          type: string
        description:
          type: string
        category:
          type: string
        owner_name:
          type: string
        capability_summary:
          type: string
        data_scope:
          type: string
        is_favorite:
          type: boolean

    CopilotAgentList:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CopilotAgent"
        page_info:
          $ref: "#/components/schemas/PageInfo"

    # --- Tasks ---
    SubmitTaskRequest:
      type: object
      required: [agent_id]
      properties:
        agent_id:
          type: string
        message:
          type: string
        structured_input:
          type: object
        attachment_ids:
          type: array
          items:
            type: string

    TaskResponse:
      type: object
      required: [id, agent_id, status, conversation_revision]
      properties:
        id:
          type: string
        agent_id:
          type: string
        agent_display_name:
          type: string
        status:
          type: string
          enum: [queued, provisioning, running, awaiting_approval, awaiting_requester_input, suspended, canceling, completed, failed, canceled]
        conversation_revision:
          type: integer
          format: int64
          minimum: 1
        current_run:
          $ref: "#/components/schemas/RunStatus"
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactResponse"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/TaskMessage"
        created_at:
          $ref: "#/components/schemas/Timestamp"

    TaskMessage:
      type: object
      required: [id, task_sequence, role, parts, created_at]
      properties:
        id:
          type: string
        run_id:
          type: string
        task_sequence:
          type: integer
          format: int64
        role:
          type: string
          enum: [requester, agent, system_summary]
        parts:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/TextPart"
              - $ref: "#/components/schemas/ArtifactPart"
              - $ref: "#/components/schemas/ActionSummaryPart"
              - $ref: "#/components/schemas/StatusPart"
        created_at:
          $ref: "#/components/schemas/Timestamp"

    TextPart:
      type: object
      required: [type, text]
      properties:
        type: { type: string, enum: [text] }
        text: { type: string }
    ArtifactPart:
      type: object
      required: [type, artifact_id, label]
      properties:
        type: { type: string, enum: [artifact] }
        artifact_id: { type: string }
        label: { type: string }
    ActionSummaryPart:
      type: object
      required: [type, action_id, summary, state]
      properties:
        type: { type: string, enum: [action_summary] }
        action_id: { type: string }
        summary: { type: string }
        state: { type: string }
    StatusPart:
      type: object
      required: [type, code, message]
      properties:
        type: { type: string, enum: [status] }
        code: { type: string }
        message: { type: string }

    AppendTaskMessageRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
        attachment_ids:
          type: array
          uniqueItems: true
          items:
            type: string

    RunAttempt:
      type: object
      required: [id, attempt_number, status, created_at]
      properties:
        id:
          type: string
        attempt_number:
          type: integer
        status:
          type: string
        status_reason:
          type: string
        created_at:
          $ref: "#/components/schemas/Timestamp"
        started_at:
          $ref: "#/components/schemas/Timestamp"
        completed_at:
          $ref: "#/components/schemas/Timestamp"

    RunAttemptList:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RunAttempt"
        page_info:
          $ref: "#/components/schemas/PageInfo"

    TaskList:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TaskResponse"
        page_info:
          $ref: "#/components/schemas/PageInfo"

    RunStatus:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          type: string
        status_reason:
          type: string

    RetryTaskRequest:
      type: object
      required: [revision_selection]
      properties:
        revision_selection:
          type: string
          enum: [original_revision, current_production_revision]

    # --- Approvals ---
    CopilotApproval:
      type: object
      required: [id, run_id, action_id, action_digest, approval_revision, tool_name, operation, agent_display_name, action_preview, status]
      properties:
        id:
          type: string
        run_id:
          type: string
        action_id:
          type: string
        action_digest:
          type: string
        approval_revision:
          type: integer
          format: int64
        tool_name:
          type: string
        operation:
          type: string
        target:
          type: string
        agent_display_name:
          type: string
        action_preview:
          type: object
          description: Human-readable action summary
          properties:
            tool_name:
              type: string
            operation:
              type: string
            target:
              type: string
            effect:
              type: string
            credential_mode:
              type: string
        risk_class:
          type: string
        status:
          type: string
          enum: [pending, satisfied, rejected, expired]
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        task_id:
          type: string
        effect:
          type: string
        policy_version:
          type: string
        latest_decision:
          $ref: "#/components/schemas/ApprovalDecisionEvidence"

    CopilotApprovalList:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CopilotApproval"
        page_info:
          $ref: "#/components/schemas/PageInfo"

    ApprovalDecisionRequest:
      type: object
      required: [decision, action_digest, approval_revision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        reason:
          type: string
        action_digest:
          type: string
        approval_revision:
          type: integer
          format: int64

    ApprovalDecisionConflict:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, current_resource]
          properties:
            code:
              type: string
              enum: [action_changed, already_decided, approval_changed, approval_expired, idempotency_key_reused]
            message:
              type: string
            current_resource:
              $ref: "#/components/schemas/CopilotApproval"

    ApprovalDecisionEvidence:
      type: object
      required: [decision, decided_by, created_at]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        reason:
          type: string
        decided_by:
          type: string
        created_at:
          $ref: "#/components/schemas/Timestamp"

    # --- Artifacts ---
    ArtifactResponse:
      type: object
      required: [id, task_id, run_id, filename, media_type, size_bytes, digest, state, scan_status]
      properties:
        id:
          type: string
        task_id:
          type: string
        run_id:
          type: string
        filename:
          type: string
        media_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        digest:
          type: string
        classification:
          type: string
        state:
          type: string
          enum: [declared, uploaded, available, rejected]
        scan_status:
          type: string
          enum: [pending, passed, failed]

    ArtifactDownloadGrant:
      type: object
      required: [artifact_id, download_url, expires_at]
      properties:
        artifact_id:
          type: string
        download_url:
          type: string
          format: uri
        expires_at:
          $ref: "#/components/schemas/Timestamp"

    ArtifactList:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ArtifactResponse"
        page_info:
          $ref: "#/components/schemas/PageInfo"

    # --- Attachments ---
    CreateAttachmentRequest:
      type: object
      required: [filename, media_type, size_bytes, digest]
      properties:
        filename:
          type: string
        media_type:
          type: string
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        digest:
          type: string
          description: SHA-256 digest in sha256:<hex> form
        classification:
          type: string

    AttachmentResponse:
      type: object
      required: [id, filename, media_type, size_bytes, digest, classification, state, scan_status]
      properties:
        id:
          type: string
        filename:
          type: string
        media_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        digest:
          type: string
        classification:
          type: string
        state:
          type: string
          enum: [declared, uploaded, available, rejected]
        scan_status:
          type: string
          enum: [pending, passed, failed]
        upload_url:
          type: string
          description: Short-lived request path for the content upload
        upload_token:
          type: string
          description: Short-lived upload credential, returned only on creation
        upload_expires_at:
          $ref: "#/components/schemas/Timestamp"

    TaskEventsTicket:
      type: object
      required: [ticket, task_id, websocket_url, expires_at]
      properties:
        ticket:
          type: string
        task_id:
          type: string
        websocket_url:
          type: string
          format: uri
        expires_at:
          $ref: "#/components/schemas/Timestamp"

    TaskEventsTicketRequest:
      type: object
      properties:
        last_cursor:
          type: string

    TaskEventSnapshot:
      type: object
      required: [schema_version, task, runs, approvals, cursor]
      properties:
        schema_version:
          type: string
          enum: [gantry.copilot.snapshot/v1]
        task:
          $ref: "#/components/schemas/TaskResponse"
        runs:
          type: array
          items:
            $ref: "#/components/schemas/RunAttempt"
        approvals:
          type: array
          items:
            $ref: "#/components/schemas/CopilotApproval"
        cursor:
          type: string

    TaskEventFrame:
      type: object
      required: [schema_version, task_id, task_sequence, cursor, event]
      properties:
        schema_version:
          type: string
          enum: [gantry.copilot.event/v1]
        task_id:
          type: string
        run_id:
          type: string
          nullable: true
        task_sequence:
          type: integer
          format: int64
          minimum: 1
        run_sequence:
          type: integer
          format: int64
          nullable: true
        cursor:
          type: string
        event:
          oneOf:
            - $ref: "#/components/schemas/MessageCommittedEvent"
            - $ref: "#/components/schemas/ContentSegmentEvent"
            - $ref: "#/components/schemas/RunStateChangedEvent"
            - $ref: "#/components/schemas/ApprovalChangedEvent"
            - $ref: "#/components/schemas/ArtifactChangedEvent"
          discriminator:
            propertyName: type
            mapping:
              message_committed: "#/components/schemas/MessageCommittedEvent"
              content_segment: "#/components/schemas/ContentSegmentEvent"
              run_state_changed: "#/components/schemas/RunStateChangedEvent"
              approval_changed: "#/components/schemas/ApprovalChangedEvent"
              artifact_changed: "#/components/schemas/ArtifactChangedEvent"

    MessageCommittedEvent:
      type: object
      required: [type, message]
      properties:
        type:
          type: string
          enum: [message_committed]
        message:
          $ref: "#/components/schemas/TaskMessage"

    ContentSegmentEvent:
      type: object
      required: [type, message_id, segment_index, text]
      properties:
        type:
          type: string
          enum: [content_segment]
        message_id:
          type: string
        segment_index:
          type: integer
          minimum: 0

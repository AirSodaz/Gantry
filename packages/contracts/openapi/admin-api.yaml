openapi: "3.1.0"
info:
  title: Gantry Admin API
  version: "1.0.0"
  description: |
    Administrative API for Gantry platform. Used by the Admin web application
    for agent design, publication, operations, evaluation, and audit.
  contact:
    name: Gantry Platform Team

servers:
  - url: /api/admin/v1
    description: Admin API v1

security:
  - oauth2:
      - admin

paths:
  /healthz:
    get:
      operationId: healthCheck
      summary: Health check
      tags: [Platform]
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /workspaces:
    get:
      operationId: listWorkspaces
      summary: List workspaces
      tags: [Workspaces]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: List of workspaces
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceList"

  /agents:
    get:
      operationId: listAgents
      summary: List agents
      tags: [Agents]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: workspace_id
          in: query
          schema:
            type: string
        - name: lifecycle_status
          in: query
          schema:
            type: string
            enum: [draft, published, deprecated, retired]
      responses:
        "200":
          description: List of agents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentList"
    post:
      operationId: createAgent
      summary: Create a new agent
      tags: [Agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentRequest"
      responses:
        "201":
          description: Agent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"

  /agents/{agent_id}:
    get:
      operationId: getAgent
      summary: Get agent details
      tags: [Agents]
      parameters:
        - $ref: "#/components/parameters/AgentIdParam"
      responses:
        "200":
          description: Agent details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"

  /agents/{agent_id}/draft:
    get:
      operationId: getAgentDraft
      summary: Get current agent draft
      tags: [Agents]
      parameters:
        - $ref: "#/components/parameters/AgentIdParam"
      responses:
        "200":
          description: Current draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDraft"
    put:
      operationId: updateAgentDraft
      summary: Update agent draft
      tags: [Agents]
      parameters:
        - $ref: "#/components/parameters/AgentIdParam"
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDraftRequest"
      responses:
        "200":
          description: Draft updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDraft"

  /agents/{agent_id}/versions:
    get:
      operationId: listAgentVersions
      summary: List agent versions
      tags: [Agents]
      parameters:
        - $ref: "#/components/parameters/AgentIdParam"
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: List of versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentVersionList"

  /runs:
    get:
      operationId: listRuns
      summary: List runs with filters
      tags: [Runs]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: workspace_id
          in: query
          schema:
            type: string
        - name: agent_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunList"

  /approvals:
    get:
      operationId: listApprovals
      summary: List pending approvals
      tags: [Approvals]
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: List of approval requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalList"

components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          scopes:
            admin: Full administrative access

  parameters:
    CursorParam:
      name: cursor
      in: query
      schema:
        type: string
      description: Pagination cursor from previous response
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Maximum number of items to return
    AgentIdParam:
      name: agent_id
      in: path
      required: true
      schema:
        type: string

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]

    Timestamp:
      type: string
      format: date-time

    PageInfo:
      type: object
      required: [has_more]
      properties:
        next_cursor:
          type: string
        has_more:
          type: boolean

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlation_id]
          properties:
            code:
              type: string
            message:
              type: string
            correlation_id:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  description:
                    type: string

    # --- Workspaces ---
    Workspace:
      type: object
      required: [id, organization_id, slug, display_name, status]
      properties:
        id:
          type: string
        organization_id:
          type: string
        slug:
          type: string
        display_name:
          type: string
        classification:
          type: string
        status:
          type: string
          enum: [active, archived]
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    WorkspaceList:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"
        page_info:
          $ref: "#/components/schemas/PageInfo"

    # --- Agents ---
    Agent:
      type: object
      required: [id, organization_id, workspace_id, slug, display_name, lifecycle_status]
      properties:
        id:
          type: string
        organization_id:
          type: string
        workspace_id:
          type: string
        slug:
          type: string
        display_name:
          type: string
        description:
          type: string
        category:
          type: string
        lifecycle_status:
          type: string
          enum: [draft, published, deprecated, retired]
        current_published_version_id:
          type: string
        owner_principal_id:
          type: string
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    AgentList:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Agent"
        page_info:
          $ref: "#/components/schemas/PageInfo"

    CreateAgentRequest:
      type: object
      required: [workspace_id, slug, display_name]
      properties:
        workspace_id:
          type: string
        slug:
          type: string
        display_name:
          type: string
        description:
          type: string
        category:
          type: string

    AgentDraft:
      type: object
      required: [id, agent_id, revision, spec, schema_version, validation_status]
      properties:
        id:
          type: string
        agent_id:
          type: string
        revision:
          type: integer
        spec:
          type: object
          description: The draft agent specification JSON
        schema_version:
          type: string
        validation_status:
          type: string
          enum: [valid, invalid, unchecked]
        validation_findings:
          type: array
          items:
            type: object
            properties:
              severity:
                type: string
                enum: [error, warning, info]
              message:
                type: string
              path:
                type: string
        updated_by:
          type: string
        updated_at:
          $ref: "#/components/schemas/Timestamp"

    UpdateDraftRequest:
      type: object
      required: [spec]
      properties:
        spec:
          type: object

    AgentVersion:
      type: object
      required: [id, agent_id, version, spec_digest]
      properties:
        id:
          type: string
        agent_id:
          type: string
        version:
          type: string
        spec_digest:
          type: string
        release_notes:
          type: string
        created_from_draft_revision:
          type: integer
        created_by:
          type: string
        created_at:
          $ref: "#/components/schemas/Timestamp"

    AgentVersionList:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AgentVersion"
        page_info:
          $ref: "#/components/schemas/PageInfo"

    # --- Runs ---
    Run:
      type: object
      required: [id, task_id, attempt_number, status]
      properties:
        id:
          type: string
        task_id:
          type: string
        attempt_number:
          type: integer
        agent_version_id:
          type: string
        status:
          type: string
          enum: [queued, provisioning, running, awaiting_approval, suspended, canceling, completed, failed, canceled, expired]
        status_reason:
          type: string
        lease_epoch:
          type: integer
        started_at:
          $ref: "#/components/schemas/Timestamp"
        completed_at:
          $ref: "#/components/schemas/Timestamp"

    RunList:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Run"
        page_info:
          $ref: "#/components/schemas/PageInfo"

    # --- Approvals ---
    ApprovalRequest:
      type: object
      required: [id, run_id, action_digest, status]
      properties:
        id:
          type: string
        run_id:
          type: string
        action_digest:
          type: string
        action_preview:
          type: object
        risk_class:
          type: string
        status:
          type: string
          enum: [pending, satisfied, rejected, expired, superseded]
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        created_at:
          $ref: "#/components/schemas/Timestamp"

    ApprovalList:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApprovalRequest"
        page_info:
          $ref: "#/components/schemas/PageInfo"

        - {name: profile_id, in: path, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/IfMatch"}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/UpsertEnvironmentProfileRequest"}}}}
      responses: {"200": {description: Environment profile, content: {application/json: {schema: {$ref: "#/components/schemas/EnvironmentProfile"}}}}, "409": {$ref: "#/components/responses/Conflict"}}

  /platform/limit-policies:
    get:
      operationId: listPlatformLimitPolicies
      summary: List organization and workspace limit policies
      tags: [Platform]
      parameters:
        - {name: workspace_id, in: query, schema: {type: string}}
      responses: {"200": {description: Limit policies, content: {application/json: {schema: {$ref: "#/components/schemas/LimitPolicyList"}}}}}
  /platform/limit-policies/{policy_id}:
    put:
      operationId: upsertPlatformLimitPolicy

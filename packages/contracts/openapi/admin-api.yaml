openapi: "3.1.0"
info:
  title: Gantry Admin API
  version: "1.0.0"
  description: Administrative API for immutable agent lifecycle management.
servers:
  - url: /api/admin/v1
security:
  - oauth2: [admin]
paths:
  /overview:
    get:
      operationId: getAdminOverview
      summary: Get the scope-authorized Admin overview
      tags: [Overview]
      parameters:
        - name: workspace_id
          in: query
          schema: {type: string}
      responses:
        "200":
          description: Admin overview
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminOverview"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /runs:
    get:
      operationId: listAdminRuns
      summary: List durable Runs in the authorized operational scope
      tags: [Runs]
      parameters:
        - name: workspace_id
          in: query
          schema: {type: string}
        - name: agent_id
          in: query
          schema: {type: string}
        - name: revision_hash
          in: query
          schema: {type: string}
        - name: status
          in: query
          schema: {type: string, enum: [queued, assigned, accepted, awaiting_approval, canceling, completed, failed, canceled]}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        "200": {description: Runs, content: {application/json: {schema: {$ref: "#/components/schemas/AdminRunList"}}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /runs/{run_id}:
    get:
      operationId: getAdminRun
      summary: Inspect one durable Run and its read-only operational evidence
      tags: [Runs]
      parameters:
        - name: run_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200": {description: Run detail, content: {application/json: {schema: {$ref: "#/components/schemas/AdminRunDetail"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /audit-events:
    get:
      operationId: listAdminAuditEvents
      summary: Search immutable audit events in the authorized scope
      tags: [Audit]
      parameters:
        - {name: workspace_id, in: query, schema: {type: string}}
        - {name: resource_type, in: query, schema: {type: string}}
        - {name: resource_id, in: query, schema: {type: string}}
        - {name: actor_id, in: query, schema: {type: string}}
        - {name: event_type, in: query, schema: {type: string}}
        - {name: outcome, in: query, schema: {type: string}}
        - {name: risk, in: query, schema: {type: string}}
        - {name: correlation_id, in: query, schema: {type: string}}
        - {name: run_id, in: query, schema: {type: string}}
        - {name: revision_hash, in: query, schema: {type: string}}
        - {name: policy_version_id, in: query, schema: {type: string}}
        - {name: before, in: query, schema: {type: string, format: date-time}}
        - {name: after, in: query, schema: {type: string, format: date-time}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        "200": {description: Audit event summaries, content: {application/json: {schema: {$ref: "#/components/schemas/AdminAuditEventList"}}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /audit-events/{event_id}:
    get:
      operationId: getAdminAuditEvent
      summary: Inspect one immutable audit event in the authorized scope
      tags: [Audit]
      parameters:
        - {name: event_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Audit event detail, content: {application/json: {schema: {$ref: "#/components/schemas/AdminAuditEventDetail"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /audit-events:export:
    post:
      operationId: createAdminAuditExport
      summary: Create a signed, scoped audit export package
      tags: [Audit]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/AdminAuditExportRequest"}}}
      responses:
        "202": {description: Export requested, content: {application/json: {schema: {$ref: "#/components/schemas/AdminAuditExport"}}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /audit-exports/{export_id}:
    get:
      operationId: getAdminAuditExport
      summary: Inspect an audit export package lifecycle
      tags: [Audit]
      parameters:
        - {name: export_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Audit export state, content: {application/json: {schema: {$ref: "#/components/schemas/AdminAuditExport"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /audit-exports/{export_id}/download:
    get:
      operationId: downloadAdminAuditExport
      summary: Get a short-lived download reference for a ready export
      tags: [Audit]
      parameters:
        - {name: export_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Short-lived download reference, content: {application/json: {schema: {$ref: "#/components/schemas/AdminAuditExportDownload"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/InvalidState"}
  /workspaces:
    get:
      operationId: listManagedWorkspaces
      summary: List workspaces manageable by the current administrator
      tags: [Workspaces]
      responses:
        "200":
          description: Managed workspaces
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkspaceList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /agents:
    get:
      operationId: listAgents
      summary: List agents in manageable workspaces
      tags: [Agents]
      parameters:
        - name: workspace_id
          in: query
          schema: {type: string}
        - name: search
          in: query
          schema: {type: string}
        - name: status
          in: query
          schema: {type: string, enum: [draft, active, retired]}
      responses:
        "200":
          description: Agents
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      operationId: createAgent
      summary: Create an agent and its initial draft
      tags: [Agents]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateAgentRequest"}
      responses:
        "201":
          description: Agent created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Agent"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /skills:
    get:
      operationId: listSkills
      summary: List imported Skill artifacts
      tags: [Skills]
      parameters:
        - name: workspace_id
          in: query
          schema: {type: string}
        - name: search
          in: query
          schema: {type: string}
        - name: status
          in: query
          schema: {type: string, enum: [available, deprecated, retired]}
      responses:
        "200": {description: Skills, content: {application/json: {schema: {$ref: "#/components/schemas/SkillList"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: registerSkill
      summary: Register an imported Skill artifact
      tags: [Skills]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/RegisterSkillRequest"}}}
      responses:
        "201": {description: Skill registered, content: {application/json: {schema: {$ref: "#/components/schemas/Skill"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /skills/{skill_id}:
    get:
      operationId: getSkill
      summary: Inspect one imported Skill artifact
      tags: [Skills]
      parameters: [{name: skill_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Skill artifact, content: {application/json: {schema: {$ref: "#/components/schemas/Skill"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /skills/{skill_id}/usage:
    get:
      operationId: listSkillUsage
      summary: List Agent drafts and revisions using a Skill artifact
      tags: [Skills]
      parameters: [{name: skill_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Skill usage, content: {application/json: {schema: {$ref: "#/components/schemas/AssetUsageList"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /plugins:
    get:
      operationId: listPlugins
      summary: List organization Plugin versions
      tags: [Plugins]
      parameters:
        - name: search
          in: query
          schema: {type: string}
        - name: status
          in: query
          schema: {type: string, enum: [active, deprecated, retired]}
      responses:
        "200": {description: Plugins, content: {application/json: {schema: {$ref: "#/components/schemas/PluginList"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: registerPlugin
      summary: Register an organization Plugin version
      tags: [Plugins]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/RegisterPluginRequest"}}}
      responses:
        "201": {description: Plugin registered, content: {application/json: {schema: {$ref: "#/components/schemas/Plugin"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /plugins/{plugin_id}:
    get:
      operationId: getPlugin
      summary: Inspect a Plugin version and workspace enablement
      tags: [Plugins]
      parameters: [{name: plugin_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Plugin detail, content: {application/json: {schema: {$ref: "#/components/schemas/PluginDetail"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /plugins/{plugin_id}/usage:
    get:
      operationId: listPluginUsage
      summary: List Agent drafts and revisions using a Plugin version
      tags: [Plugins]
      parameters: [{name: plugin_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Plugin usage, content: {application/json: {schema: {$ref: "#/components/schemas/AssetUsageList"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /tools:
    get:
      operationId: listTools
      summary: List active Tool descriptors
      tags: [Tools]
      parameters:
        - name: search
          in: query
          schema: {type: string}
        - name: status
          in: query
          schema: {type: string, enum: [active, proposed, deprecated, retired]}
      responses:
        "200": {description: Tools, content: {application/json: {schema: {$ref: "#/components/schemas/ToolList"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: registerTool
      summary: Register a Tool server and descriptor version
      tags: [Tools]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/RegisterToolRequest"}}}
      responses:
        "201": {description: Tool registered, content: {application/json: {schema: {$ref: "#/components/schemas/Tool"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /tools/{tool_id}:
    get:
      operationId: getTool
      summary: Inspect a Tool descriptor, server, and input schema
      tags: [Tools]
      parameters: [{name: tool_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Tool descriptor, content: {application/json: {schema: {$ref: "#/components/schemas/Tool"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /tools/{tool_id}/usage:
    get:
      operationId: listToolUsage
      summary: List Agent drafts and revisions using a Tool descriptor
      tags: [Tools]
      parameters: [{name: tool_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Tool usage, content: {application/json: {schema: {$ref: "#/components/schemas/AssetUsageList"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /plugins/{plugin_id}/enable:
    post:
      operationId: enablePluginForWorkspace
      summary: Enable one active Plugin version in a workspace
      tags: [Plugins]
      parameters:
        - name: plugin_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/EnablePluginRequest"}}}
      responses:
        "204": {description: Plugin enabled}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /skills/{skill_id}:activate:
    post:
      operationId: activateSkill
      summary: Activate an imported Skill artifact
      tags: [Skills]
      parameters:
        - name: skill_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: "#/components/schemas/AssetStatusRequest"}}}
      responses:
        "204": {description: Skill activated}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /plugins/{plugin_id}/disable:
    post:
      operationId: disablePlugin
      summary: Disable a Plugin version in a workspace
      tags: [Plugins]
      parameters:
        - name: plugin_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/EnablePluginRequest"}}}
      responses:
        "204": {description: Plugin disabled}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /skills/{skill_id}:deprecate:
    post:
      operationId: deprecateSkill
      summary: Deprecate an imported Skill artifact
      tags: [Skills]
      parameters: [{name: skill_id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: "#/components/schemas/AssetStatusRequest"}}}
      responses:
        "204": {description: Skill deprecated}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /skills/{skill_id}:retire:
    post:
      operationId: retireSkill
      summary: Retire an imported Skill artifact
      tags: [Skills]
      parameters: [{name: skill_id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: "#/components/schemas/AssetStatusRequest"}}}
      responses:
        "204": {description: Skill retired}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /plugins/{plugin_id}:activate:
    post:
      operationId: activatePlugin
      summary: Activate an installed Plugin version
      tags: [Plugins]
      parameters: [{name: plugin_id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: "#/components/schemas/AssetStatusRequest"}}}
      responses:
        "204": {description: Plugin activated}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /plugins/{plugin_id}:deprecate:
    post:
      operationId: deprecatePlugin
      summary: Deprecate an installed Plugin version
      tags: [Plugins]
      parameters: [{name: plugin_id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: "#/components/schemas/AssetStatusRequest"}}}
      responses:
        "204": {description: Plugin deprecated}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /plugins/{plugin_id}:retire:
    post:
      operationId: retirePlugin
      summary: Retire an installed Plugin version
      tags: [Plugins]
      parameters: [{name: plugin_id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: "#/components/schemas/AssetStatusRequest"}}}
      responses:
        "204": {description: Plugin retired}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /tools/{tool_id}:activate:
    post:
      operationId: activateTool
      summary: Activate a proposed Tool descriptor
      tags: [Tools]
      parameters: [{name: tool_id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: "#/components/schemas/AssetStatusRequest"}}}
      responses:
        "204": {description: Tool activated}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /tools/{tool_id}:deprecate:
    post:
      operationId: deprecateTool
      summary: Deprecate a Tool descriptor
      tags: [Tools]
      parameters: [{name: tool_id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: "#/components/schemas/AssetStatusRequest"}}}
      responses:
        "204": {description: Tool deprecated}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /tools/{tool_id}:retire:
    post:
      operationId: retireTool
      summary: Retire a Tool descriptor
      tags: [Tools]
      parameters: [{name: tool_id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: "#/components/schemas/AssetStatusRequest"}}}
      responses:
        "204": {description: Tool retired}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /agents/{agent_id}:
    get:
      operationId: getAgent
      summary: Get an agent in the current administrator domain
      tags: [Agents]
      parameters: [{$ref: "#/components/parameters/AgentId"}]
      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Agent"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /agents/{agent_id}/lifecycle:
    get:
      operationId: getAgentLifecycle
      summary: Get named Drafts, exact Deployments, and recent lifecycle activity
      tags: [Agents]
      parameters: [{$ref: "#/components/parameters/AgentId"}]
      responses:
        "200": {description: Agent lifecycle, content: {application/json: {schema: {$ref: "#/components/schemas/AgentLifecycleOverview"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /agents/{agent_id}/drafts:
    get:
      operationId: listAgentDrafts
      summary: List named mutable Draft working copies
      tags: [Drafts]
      parameters: [{$ref: "#/components/parameters/AgentId"}]
      responses:
        "200": {description: Drafts, content: {application/json: {schema: {$ref: "#/components/schemas/AgentDraftList"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      operationId: createAgentDraft
      summary: Create a named Draft, optionally from one exact Revision
      tags: [Drafts]
      parameters: [{$ref: "#/components/parameters/AgentId"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateAgentDraftRequest"}}}}
      responses:
        "201": {description: Draft created, content: {application/json: {schema: {$ref: "#/components/schemas/NamedAgentDraft"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /agents/{agent_id}/drafts/{draft_id}:
    get:
      operationId: getNamedAgentDraft
      summary: Get one named Draft working copy
      tags: [Drafts]
      parameters: [{$ref: "#/components/parameters/AgentId"}, {name: draft_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Draft, content: {application/json: {schema: {$ref: "#/components/schemas/NamedAgentDraft"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      operationId: updateNamedAgentDraft
      summary: Replace a named Draft with optimistic concurrency
      tags: [Drafts]
      parameters: [{$ref: "#/components/parameters/AgentId"}, {name: draft_id, in: path, required: true, schema: {type: string}}, {$ref: "#/components/parameters/IfMatch"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/UpdateDraftRequest"}}}}
      responses:

openapi: "3.1.0"
info:
  title: Gantry Admin API
  version: "1.0.0"
  description: Administrative API for immutable agent lifecycle management.
servers:
  - url: /api/admin/v1
security:
  - oauth2: [admin]
paths:
  /overview:
    get:
      operationId: getAdminOverview
      summary: Get the scope-authorized Admin overview
      tags: [Overview]
      parameters:
        - name: workspace_id
          in: query
          schema: {type: string}
      responses:
        "200":
          description: Admin overview
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminOverview"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /workspaces:
    get:
      operationId: listManagedWorkspaces
      summary: List workspaces manageable by the current administrator
      tags: [Workspaces]
      responses:
        "200":
          description: Managed workspaces
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkspaceList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /agents:
    get:
      operationId: listAgents
      summary: List agents in manageable workspaces
      tags: [Agents]
      parameters:
        - name: workspace_id
          in: query
          schema: {type: string}
        - name: search
          in: query
          schema: {type: string}
        - name: status
          in: query
          schema: {type: string, enum: [draft, active, retired]}
      responses:
        "200":
          description: Agents
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      operationId: createAgent
      summary: Create an agent and its initial draft
      tags: [Agents]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateAgentRequest"}
      responses:
        "201":
          description: Agent created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Agent"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /skills:
    get:
      operationId: listSkills
      summary: List imported Skill artifacts
      tags: [Skills]
      parameters:
        - name: workspace_id
          in: query
          schema: {type: string}
        - name: search
          in: query
          schema: {type: string}
        - name: status
          in: query
          schema: {type: string, enum: [available, deprecated, retired]}
      responses:
        "200": {description: Skills, content: {application/json: {schema: {$ref: "#/components/schemas/SkillList"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: registerSkill
      summary: Register an imported Skill artifact
      tags: [Skills]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/RegisterSkillRequest"}}}
      responses:
        "201": {description: Skill registered, content: {application/json: {schema: {$ref: "#/components/schemas/Skill"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /skills/{skill_id}:
    get:
      operationId: getSkill
      summary: Inspect one imported Skill artifact
      tags: [Skills]
      parameters: [{name: skill_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Skill artifact, content: {application/json: {schema: {$ref: "#/components/schemas/Skill"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /skills/{skill_id}/usage:
    get:
      operationId: listSkillUsage
      summary: List Agent drafts and revisions using a Skill artifact
      tags: [Skills]
      parameters: [{name: skill_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Skill usage, content: {application/json: {schema: {$ref: "#/components/schemas/AssetUsageList"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /plugins:
    get:
      operationId: listPlugins
      summary: List organization Plugin versions
      tags: [Plugins]
      parameters:
        - name: search
          in: query
          schema: {type: string}
        - name: status
          in: query
          schema: {type: string, enum: [active, deprecated, retired]}
      responses:
        "200": {description: Plugins, content: {application/json: {schema: {$ref: "#/components/schemas/PluginList"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: registerPlugin
      summary: Register an organization Plugin version
      tags: [Plugins]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/RegisterPluginRequest"}}}
      responses:
        "201": {description: Plugin registered, content: {application/json: {schema: {$ref: "#/components/schemas/Plugin"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /plugins/{plugin_id}:
    get:
      operationId: getPlugin
      summary: Inspect a Plugin version and workspace enablement
      tags: [Plugins]
      parameters: [{name: plugin_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Plugin detail, content: {application/json: {schema: {$ref: "#/components/schemas/PluginDetail"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /plugins/{plugin_id}/usage:
    get:
      operationId: listPluginUsage
      summary: List Agent drafts and revisions using a Plugin version
      tags: [Plugins]
      parameters: [{name: plugin_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Plugin usage, content: {application/json: {schema: {$ref: "#/components/schemas/AssetUsageList"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /tools:
    get:
      operationId: listTools
      summary: List active Tool descriptors
      tags: [Tools]
      parameters:
        - name: search
          in: query
          schema: {type: string}
        - name: status
          in: query
          schema: {type: string, enum: [active, proposed, deprecated, retired]}
      responses:
        "200": {description: Tools, content: {application/json: {schema: {$ref: "#/components/schemas/ToolList"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: registerTool
      summary: Register a Tool server and descriptor version
      tags: [Tools]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/RegisterToolRequest"}}}
      responses:
        "201": {description: Tool registered, content: {application/json: {schema: {$ref: "#/components/schemas/Tool"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /tools/{tool_id}:
    get:
      operationId: getTool
      summary: Inspect a Tool descriptor, server, and input schema
      tags: [Tools]
      parameters: [{name: tool_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Tool descriptor, content: {application/json: {schema: {$ref: "#/components/schemas/Tool"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /tools/{tool_id}/usage:
    get:
      operationId: listToolUsage
      summary: List Agent drafts and revisions using a Tool descriptor
      tags: [Tools]
      parameters: [{name: tool_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Tool usage, content: {application/json: {schema: {$ref: "#/components/schemas/AssetUsageList"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /plugins/{plugin_id}/enable:
    post:
      operationId: enablePluginForWorkspace
      summary: Enable one active Plugin version in a workspace
      tags: [Plugins]
      parameters:
        - name: plugin_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/EnablePluginRequest"}}}
      responses:
        "204": {description: Plugin enabled}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /skills/{skill_id}:activate:
    post:
      operationId: activateSkill
      summary: Activate an imported Skill artifact
      tags: [Skills]
      parameters:
        - name: skill_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: "#/components/schemas/AssetStatusRequest"}}}
      responses:
        "204": {description: Skill activated}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /plugins/{plugin_id}/disable:
    post:
      operationId: disablePlugin
      summary: Disable a Plugin version in a workspace
      tags: [Plugins]
      parameters:
        - name: plugin_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/EnablePluginRequest"}}}
      responses:
        "204": {description: Plugin disabled}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /skills/{skill_id}:deprecate:
    post:
      operationId: deprecateSkill
      summary: Deprecate an imported Skill artifact
      tags: [Skills]
      parameters: [{name: skill_id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: "#/components/schemas/AssetStatusRequest"}}}
      responses:
        "204": {description: Skill deprecated}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /skills/{skill_id}:retire:
    post:
      operationId: retireSkill
      summary: Retire an imported Skill artifact
      tags: [Skills]
      parameters: [{name: skill_id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: "#/components/schemas/AssetStatusRequest"}}}
      responses:
        "204": {description: Skill retired}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /plugins/{plugin_id}:activate:
    post:
      operationId: activatePlugin
      summary: Activate an installed Plugin version
      tags: [Plugins]
      parameters: [{name: plugin_id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: "#/components/schemas/AssetStatusRequest"}}}
      responses:
        "204": {description: Plugin activated}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /plugins/{plugin_id}:deprecate:
    post:
      operationId: deprecatePlugin
      summary: Deprecate an installed Plugin version
      tags: [Plugins]
      parameters: [{name: plugin_id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: "#/components/schemas/AssetStatusRequest"}}}
      responses:
        "204": {description: Plugin deprecated}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /plugins/{plugin_id}:retire:
    post:
      operationId: retirePlugin
      summary: Retire an installed Plugin version
      tags: [Plugins]
      parameters: [{name: plugin_id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: "#/components/schemas/AssetStatusRequest"}}}
      responses:
        "204": {description: Plugin retired}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /tools/{tool_id}:activate:
    post:
      operationId: activateTool
      summary: Activate a proposed Tool descriptor
      tags: [Tools]
      parameters: [{name: tool_id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: "#/components/schemas/AssetStatusRequest"}}}
      responses:
        "204": {description: Tool activated}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /tools/{tool_id}:deprecate:
    post:
      operationId: deprecateTool
      summary: Deprecate a Tool descriptor
      tags: [Tools]
      parameters: [{name: tool_id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: "#/components/schemas/AssetStatusRequest"}}}
      responses:
        "204": {description: Tool deprecated}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /tools/{tool_id}:retire:
    post:
      operationId: retireTool
      summary: Retire a Tool descriptor
      tags: [Tools]
      parameters: [{name: tool_id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: "#/components/schemas/AssetStatusRequest"}}}
      responses:
        "204": {description: Tool retired}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /agents/{agent_id}:
    get:
      operationId: getAgent
      summary: Get an agent in the current administrator domain
      tags: [Agents]
      parameters: [{$ref: "#/components/parameters/AgentId"}]
      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Agent"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /agents/{agent_id}/lifecycle:
    get:
      operationId: getAgentLifecycle
      summary: Get named Drafts, exact Deployments, and recent lifecycle activity
      tags: [Agents]
      parameters: [{$ref: "#/components/parameters/AgentId"}]
      responses:
        "200": {description: Agent lifecycle, content: {application/json: {schema: {$ref: "#/components/schemas/AgentLifecycleOverview"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /agents/{agent_id}/drafts:
    get:
      operationId: listAgentDrafts
      summary: List named mutable Draft working copies
      tags: [Drafts]
      parameters: [{$ref: "#/components/parameters/AgentId"}]
      responses:
        "200": {description: Drafts, content: {application/json: {schema: {$ref: "#/components/schemas/AgentDraftList"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      operationId: createAgentDraft
      summary: Create a named Draft, optionally from one exact Revision
      tags: [Drafts]
      parameters: [{$ref: "#/components/parameters/AgentId"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateAgentDraftRequest"}}}}
      responses:
        "201": {description: Draft created, content: {application/json: {schema: {$ref: "#/components/schemas/NamedAgentDraft"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /agents/{agent_id}/drafts/{draft_id}:
    get:
      operationId: getNamedAgentDraft
      summary: Get one named Draft working copy
      tags: [Drafts]
      parameters: [{$ref: "#/components/parameters/AgentId"}, {name: draft_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Draft, content: {application/json: {schema: {$ref: "#/components/schemas/NamedAgentDraft"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      operationId: updateNamedAgentDraft
      summary: Replace a named Draft with optimistic concurrency
      tags: [Drafts]
      parameters: [{$ref: "#/components/parameters/AgentId"}, {name: draft_id, in: path, required: true, schema: {type: string}}, {$ref: "#/components/parameters/IfMatch"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/UpdateDraftRequest"}}}}
      responses:
        "200": {description: Draft updated, content: {application/json: {schema: {$ref: "#/components/schemas/NamedAgentDraft"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "412": {$ref: "#/components/responses/RevisionConflict"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /agents/{agent_id}/drafts/{draft_id}:archive:
    post:
      operationId: archiveAgentDraft
      summary: Archive a non-Main Draft without deleting its Revisions
      tags: [Drafts]
      parameters: [{$ref: "#/components/parameters/AgentId"}, {name: draft_id, in: path, required: true, schema: {type: string}}]
      responses:
        "204": {description: Draft archived}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/InvalidState"}
  /agents/{agent_id}/drafts/{draft_id}:commit:
    post:
      operationId: commitAgentDraft
      summary: Commit one valid Draft as an immutable hash-identified Revision
      tags: [Revisions]
      parameters: [{$ref: "#/components/parameters/AgentId"}, {name: draft_id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CommitAgentDraftRequest"}}}}
      responses:
        "201": {description: Revision committed, content: {application/json: {schema: {$ref: "#/components/schemas/AgentRevision"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/InvalidState"}
  /agents/{agent_id}/revisions:
    get:
      operationId: listAgentRevisions
      summary: List immutable Agent Revisions ordered by commit time
      tags: [Revisions]
      parameters: [{$ref: "#/components/parameters/AgentId"}]
      responses:
        "200": {description: Revisions, content: {application/json: {schema: {$ref: "#/components/schemas/AgentRevisionList"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /agents/{agent_id}/revisions/{revision_hash}:
    get:
      operationId: getAgentRevision
      summary: Inspect one immutable Revision by its full hash
      tags: [Revisions]
      parameters: [{$ref: "#/components/parameters/AgentId"}, {name: revision_hash, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Revision, content: {application/json: {schema: {$ref: "#/components/schemas/AgentRevision"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /agents/{agent_id}/revisions/{revision_hash}/review:
    get:
      operationId: getAgentRevisionReview
      summary: Get review evidence for one exact Revision
      tags: [Reviews]
      parameters: [{$ref: "#/components/parameters/AgentId"}, {name: revision_hash, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Revision review, content: {application/json: {schema: {$ref: "#/components/schemas/AgentRevisionReview"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      operationId: submitAgentRevisionReview
      summary: Submit review evidence for one exact Revision
      tags: [Reviews]
      parameters: [{$ref: "#/components/parameters/AgentId"}, {name: revision_hash, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SubmitReviewRequest"}}}}
      responses:
        "201": {description: Review submitted, content: {application/json: {schema: {$ref: "#/components/schemas/AgentRevisionReview"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/InvalidState"}
  /agents/{agent_id}/revisions/{revision_hash}:review-decision:
    post:
      operationId: decideAgentRevisionReview
      summary: Approve or reject one exact Revision review
      tags: [Reviews]
      parameters: [{$ref: "#/components/parameters/AgentId"}, {name: revision_hash, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ReviewDecisionRequest"}}}}
      responses:
        "200": {description: Review decision recorded, content: {application/json: {schema: {$ref: "#/components/schemas/AgentRevisionReview"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/InvalidState"}
  /agents/{agent_id}/revisions/{revision_hash}:publish:
    post:
      operationId: publishAgentRevision
      summary: Move the Production Deployment pointer to an approved Revision
      tags: [Deployments]
      parameters: [{$ref: "#/components/parameters/AgentId"}, {name: revision_hash, in: path, required: true, schema: {type: string}}]
      requestBody: {required: false, content: {application/json: {schema: {$ref: "#/components/schemas/PublishAgentRevisionRequest"}}}}
      responses:
        "200": {description: Production Deployment, content: {application/json: {schema: {$ref: "#/components/schemas/AgentDeployment"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/InvalidState"}
        "412": {$ref: "#/components/responses/RevisionConflict"}
  /agents/{agent_id}/deployments:
    get:
      operationId: listAgentDeployments
      summary: List exact Revision Deployment pointers
      tags: [Deployments]
      parameters: [{$ref: "#/components/parameters/AgentId"}]
      responses:
        "200": {description: Deployments, content: {application/json: {schema: {$ref: "#/components/schemas/AgentDeploymentList"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      operationId: createAgentTestDeployment
      summary: Create a named Test Deployment for one exact Revision
      tags: [Deployments]
      parameters: [{$ref: "#/components/parameters/AgentId"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateAgentDeploymentRequest"}}}}
      responses:
        "201": {description: Test Deployment created, content: {application/json: {schema: {$ref: "#/components/schemas/AgentDeployment"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /agents/{agent_id}/deployments/{deployment_id}:stop:
    post:
      operationId: stopAgentTestDeployment
      summary: Stop one Test Deployment without deleting its Revision
      tags: [Deployments]
      parameters: [{$ref: "#/components/parameters/AgentId"}, {name: deployment_id, in: path, required: true, schema: {type: string}}]
      responses:
        "204": {description: Test Deployment stopped}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/InvalidState"}
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          scopes: {admin: Administrative agent lifecycle access}
  parameters:
    AgentId:
      name: agent_id
      in: path
      required: true
      schema: {type: string}
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string}
      description: Current named Draft working-copy ETag.
  responses:
    Unauthorized:
      description: Authentication is required.
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
    Forbidden:
      description: Administrative access is required.
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
    NotFound:
      description: Resource was not found.
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
    InvalidInput:
      description: Request is invalid.
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
    InvalidState:
      description: Operation is not permitted in the current state.
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
    RevisionConflict:
      description: Draft revision is stale.
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
    PageInfo:
      type: object
      required: [has_more]
      properties:
        has_more: {type: boolean}
    Workspace:
      type: object
      required: [id, slug, display_name]
      properties:
        id: {type: string}
        slug: {type: string}
        display_name: {type: string}
    WorkspaceList:
      type: object
      required: [items, page_info]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Workspace"}}
        page_info: {$ref: "#/components/schemas/PageInfo"}
    Skill:
      type: object
      required: [id, workspace_id, slug, display_name, description, source_type, source_ref, declared_version, content_digest, status, metadata_json]
      properties:
        id: {type: string}
        workspace_id: {type: string}
        slug: {type: string}
        display_name: {type: string}
        description: {type: string}
        source_type: {type: string, enum: [marketplace, locator, upload, local]}
        source_ref: {type: string}
        declared_version: {type: string}
        content_digest: {type: string}
        status: {type: string, enum: [available, deprecated, retired]}
        metadata_json: {type: object, additionalProperties: true}
    SkillList:
      type: object
      required: [items, page_info]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Skill"}}
        page_info: {$ref: "#/components/schemas/PageInfo"}
    AssetUsage:
      type: object
      required: [agent_id, agent_name, workspace_id, reference_kind, reference_id]
      properties:
        agent_id: {type: string}
        agent_name: {type: string}
        workspace_id: {type: string}
        reference_kind: {type: string, enum: [draft, revision]}
        reference_id: {type: string}
        reference_hash: {type: string}
    AssetUsageList:
      type: object
      required: [items, page_info]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/AssetUsage"}}
        page_info: {$ref: "#/components/schemas/PageInfo"}
    RegisterSkillRequest:
      type: object
      required: [workspace_id, slug, display_name, source_type, source_ref, content_digest]
      properties:
        workspace_id: {type: string}
        slug: {type: string}
        display_name: {type: string}
        description: {type: string}
        source_type: {type: string, enum: [marketplace, locator, upload, local]}
        source_ref: {type: string}
        declared_version: {type: string}
        content_digest: {type: string}
        metadata_json: {type: object}
    Plugin:
      type: object
      required: [id, slug, display_name, description, version, content_digest, status, manifest_json]
      properties:
        id: {type: string}
        slug: {type: string}
        display_name: {type: string}
        description: {type: string}
        version: {type: string}
        content_digest: {type: string}
        status: {type: string, enum: [active, deprecated, retired]}
        manifest_json: {type: object, additionalProperties: true}
    PluginList:
      type: object
      required: [items, page_info]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Plugin"}}
        page_info: {$ref: "#/components/schemas/PageInfo"}
    PluginWorkspace:
      type: object
      required: [id, display_name]
      properties:
        id: {type: string}
        display_name: {type: string}
    PluginDetail:
      allOf:
        - $ref: "#/components/schemas/Plugin"
        - type: object
          required: [workspaces]
          properties:
            workspaces: {type: array, items: {$ref: "#/components/schemas/PluginWorkspace"}}
    RegisterPluginRequest:
      type: object
      required: [slug, display_name, version, content_digest]
      properties:
        slug: {type: string}
        display_name: {type: string}
        description: {type: string}
        version: {type: string}
        content_digest: {type: string}
        manifest_json: {type: object, additionalProperties: true}
    EnablePluginRequest:
      type: object
      required: [workspace_id]
      properties:
        workspace_id: {type: string}
    AssetStatusRequest:
      type: object
      additionalProperties: false
      properties:
        reason: {type: string, maxLength: 4000}
    Tool:
      type: object
      required: [id, server_id, server_name, server_type, endpoint_ref, fully_qualified_name, version, effect, idempotency, content_digest, schema_json, status]
      properties:
        id: {type: string}
        server_id: {type: string}
        server_name: {type: string}
        server_type: {type: string, enum: [builtin, mcp, cli]}
        endpoint_ref: {type: string}
        fully_qualified_name: {type: string}
        version: {type: string}
        effect: {type: string, enum: [read, write, external_side_effect, administrative]}
        idempotency: {type: string, enum: [read_only, idempotent, compensatable, non_repeatable]}
        content_digest: {type: string}
        schema_json: {type: object, additionalProperties: true}
        status: {type: string, enum: [active, proposed, deprecated, retired]}
    ToolList:
      type: object
      required: [items, page_info]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Tool"}}
        page_info: {$ref: "#/components/schemas/PageInfo"}
    RegisterToolRequest:
      type: object
      required: [server_name, server_type, fully_qualified_name, version, effect, idempotency, content_digest]
      properties:
        server_name: {type: string}
        server_type: {type: string, enum: [builtin, mcp, cli]}
        endpoint_ref: {type: string}
        fully_qualified_name: {type: string}
        version: {type: string}
        effect: {type: string, enum: [read, write, external_side_effect, administrative]}
        idempotency: {type: string, enum: [read_only, idempotent, compensatable, non_repeatable]}
        content_digest: {type: string}
        schema_json: {type: object, additionalProperties: true}
    Agent:
      type: object
      required: [id, organization_id, workspace_id, slug, display_name, description, category, lifecycle_status]
      properties:
        id: {type: string}
        organization_id: {type: string}
        workspace_id: {type: string}
        slug: {type: string}
        display_name: {type: string}
        description: {type: string}
        category: {type: string}
        lifecycle_status: {type: string, enum: [draft, published, active, retired]}
        current_published_version_id: {type: string}
        current_production_revision_hash: {type: string}
    AgentList:
      type: object
      required: [items, page_info]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Agent"}}
        page_info: {$ref: "#/components/schemas/PageInfo"}
    CreateAgentRequest:
      type: object
      required: [workspace_id, slug, display_name, description, category]
      properties:
        workspace_id: {type: string}
        slug: {type: string}
        display_name: {type: string}
        description: {type: string}
        category: {type: string}
    NamedAgentDraft:
      type: object
      required: [id, agent_id, name, status, spec, schema_version, working_copy_etag, validation_status, validation_findings, created_by, updated_by, created_at, updated_at]
      properties:
        id: {type: string}
        agent_id: {type: string}
        name: {type: string}
        status: {type: string, enum: [active, archived]}
        derived_from_revision_hash: {type: string}
        latest_revision_hash: {type: string}
        spec: {type: object}
        schema_version: {type: string}
        working_copy_etag: {type: integer}
        validation_status: {type: string, enum: [valid, invalid]}
        validation_findings: {type: array, items: {$ref: "#/components/schemas/ValidationFinding"}}
        created_by: {type: string}
        updated_by: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AgentDraftList:
      type: object
      required: [items, page_info]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/NamedAgentDraft"}}
        page_info: {$ref: "#/components/schemas/PageInfo"}
    CreateAgentDraftRequest:
      type: object
      required: [name]
      properties:
        name: {type: string}
        from_revision_hash: {type: string}
    CommitAgentDraftRequest:
      type: object
      required: [message]
      properties:
        message: {type: string, maxLength: 4000}
    AgentRevision:
      type: object
      required: [id, agent_id, revision_hash, source_draft_id, source_draft_name, message, spec, spec_digest, schema_version, created_at, created_by, review_status, production_deployed, test_deployed, run_count, prompt_snapshot]
      properties:
        id: {type: string}
        agent_id: {type: string}
        revision_hash: {type: string}
        source_draft_id: {type: string}
        source_draft_name: {type: string}
        message: {type: string}
        spec: {type: object}
        spec_digest: {type: string}
        schema_version: {type: string}
        runtime_image_digest: {type: string}
        created_at: {type: string, format: date-time}
        created_by: {type: string}
        review_status: {type: string, enum: [not_submitted, pending, approved, rejected, superseded]}
        production_deployed: {type: boolean}
        test_deployed: {type: boolean}
        run_count: {type: integer}
        latest_run_status: {type: string}
        latest_run_at: {type: string, format: date-time}
        prompt_snapshot: {$ref: "#/components/schemas/PromptSnapshot"}
    AgentRevisionList:
      type: object
      required: [items, page_info]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/AgentRevision"}}
        page_info: {$ref: "#/components/schemas/PageInfo"}
    AgentRevisionReview:
      type: object
      required: [agent_id, revision_hash, release_notes, diff, risk_summary, status]
      properties:
        id: {type: string}
        agent_id: {type: string}
        revision_hash: {type: string}
        base_revision_hash: {type: string}
        release_notes: {type: string}
        diff: {type: array, items: {$ref: "#/components/schemas/DiffEntry"}}
        risk_summary: {$ref: "#/components/schemas/RiskSummary"}
        status: {type: string, enum: [not_submitted, pending, approved, rejected, superseded]}
        submitted_by: {type: string}
        reviewed_by: {type: string}
        review_reason: {type: string}
        submitted_at: {type: string, format: date-time}
        reviewed_at: {type: string, format: date-time}
    AgentDeployment:
      type: object
      required: [id, agent_id, workspace_id, name, environment_kind, revision_id, revision_hash, spec_digest, status, environment_policy, changed_by, created_at, updated_at]
      properties:
        id: {type: string}
        agent_id: {type: string}
        workspace_id: {type: string}
        name: {type: string}
        environment_kind: {type: string, enum: [test, production]}
        revision_id: {type: string}
        revision_hash: {type: string}
        spec_digest: {type: string}
        status: {type: string, enum: [active, stopped, quarantined]}
        owner: {type: string}
        purpose: {type: string}
        expires_at: {type: string, format: date-time}
        environment_policy: {type: object, additionalProperties: true}
        changed_by: {type: string}
        review_id: {type: string}
        previous_revision_hash: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AgentDeploymentList:
      type: object
      required: [items, page_info]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/AgentDeployment"}}
        page_info: {$ref: "#/components/schemas/PageInfo"}
    CreateAgentDeploymentRequest:
      type: object
      required: [name, revision_hash]
      properties:
        name: {type: string}
        revision_hash: {type: string}
        purpose: {type: string}
        expires_at: {type: string, format: date-time}
        environment_policy: {type: object, additionalProperties: true}
    PublishAgentRevisionRequest:
      type: object
      properties:
        expected_production_revision_hash: {type: string}
    AgentLifecycleOverview:
      type: object
      required: [agent, main_draft, drafts, test_deployments, revision_count, recent_activity]
      properties:
        agent: {$ref: "#/components/schemas/Agent"}
        main_draft: {$ref: "#/components/schemas/NamedAgentDraft"}
        drafts: {type: array, items: {$ref: "#/components/schemas/NamedAgentDraft"}}
        production_deployment:
          oneOf:
            - {$ref: "#/components/schemas/AgentDeployment"}
            - {type: 'null'}
        test_deployments: {type: array, items: {$ref: "#/components/schemas/AgentDeployment"}}
        revision_count: {type: integer}
        recent_activity: {type: array, items: {$ref: "#/components/schemas/ActivityItem"}}
    UpdateDraftRequest:
      type: object
      required: [spec]
      properties:
        spec: {type: object}
    ValidationFinding:
      type: object
      required: [path, message]
      properties:
        path: {type: string}
        message: {type: string}
    PromptSnapshot:
      type: object
      required: [compiler_version, content_digest, compiled_text]
      properties:
        compiler_version: {type: string}
        content_digest: {type: string}
        compiled_text: {type: string}
        system_prompt: {type: string}
        user_input: {type: string}
        rules: {type: array, items: {type: object}}
    ActivityItem:
      type: object
      required: [id, event_type, payload, created_at]
      properties:
        id: {type: integer, format: int64}
        event_type: {type: string}
        payload: {type: object, additionalProperties: true}
        created_at: {type: string, format: date-time}
    AdminOverviewScope:
      type: object
      required: [label]
      properties:
        workspace_id: {type: string}
        label: {type: string}
    AdminOverviewMetrics:
      type: object
      required: [agents_total, published_agents, drafts_needing_review, invalid_drafts, active_runs, awaiting_approvals, failed_runs_24_hours]
      properties:
        agents_total: {type: integer}
        published_agents: {type: integer}
        drafts_needing_review: {type: integer}
        invalid_drafts: {type: integer}
        active_runs: {type: integer}
        awaiting_approvals: {type: integer}
        failed_runs_24_hours: {type: integer}
    AdminOverviewAttentionItem:
      type: object
      required: [id, kind, severity, title, description, href, created_at]
      properties:
        id: {type: string}
        kind: {type: string}
        severity: {type: string, enum: [high, medium]}
        title: {type: string}
        description: {type: string}
        href: {type: string}
        created_at: {type: string, format: date-time}
    AdminOverviewPublication:
      type: object
      required: [agent_id, agent_name, workspace_id, revision_hash, published_at]
      properties:
        agent_id: {type: string}
        agent_name: {type: string}
        workspace_id: {type: string}
        revision_hash: {type: string}
        published_at: {type: string, format: date-time}
    AdminOverview:
      type: object
      required: [scope, generated_at, metrics, attention, recent_publications, recent_activity, unavailable_signals]
      properties:
        scope: {$ref: "#/components/schemas/AdminOverviewScope"}
        generated_at: {type: string, format: date-time}
        metrics: {$ref: "#/components/schemas/AdminOverviewMetrics"}
        attention: {type: array, items: {$ref: "#/components/schemas/AdminOverviewAttentionItem"}}
        recent_publications: {type: array, items: {$ref: "#/components/schemas/AdminOverviewPublication"}}
        recent_activity: {type: array, items: {$ref: "#/components/schemas/ActivityItem"}}
        unavailable_signals: {type: array, items: {type: string}}
    SubmitReviewRequest:
      type: object
      required: [release_notes]
      properties:
        release_notes: {type: string, maxLength: 4000}
    ReviewDecisionRequest:
      type: object
      required: [decision, reason]
      properties:
        decision: {type: string, enum: [approve, reject]}
        reason: {type: string, maxLength: 4000}
    DiffEntry:
      type: object
      required: [path, change, category, risk]
      properties:
        path: {type: string}
        change: {type: string, enum: [added, removed, changed]}
        category: {type: string, enum: [metadata, behavior, security]}
        risk: {type: string, enum: [low, medium, high]}
        before: {}
        after: {}
    RiskSummary:
      type: object
      required: [total, high, medium, low]
      properties:
        total: {type: integer}
        high: {type: integer}
        medium: {type: integer}
        low: {type: integer}

openapi: "3.1.0"
info:
  title: Gantry Admin API
  version: "1.0.0"
  description: Administrative API for immutable agent lifecycle management.
servers:
  - url: /api/admin/v1
security:
  - oauth2: [admin]
paths:
  /workspaces:
    get:
      operationId: listManagedWorkspaces
      summary: List workspaces manageable by the current administrator
      tags: [Workspaces]
      responses:
        "200":
          description: Managed workspaces
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkspaceList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /agents:
    get:
      operationId: listAgents
      summary: List agents in manageable workspaces
      tags: [Agents]
      parameters:
        - name: workspace_id
          in: query
          schema: {type: string}
      responses:
        "200":
          description: Agents
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      operationId: createAgent
      summary: Create an agent and its initial draft
      tags: [Agents]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateAgentRequest"}
      responses:
        "201":
          description: Agent created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Agent"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /skills:
    get:
      operationId: listSkills
      summary: List imported Skill artifacts
      tags: [Skills]
      parameters:
        - name: workspace_id
          in: query
          schema: {type: string}
      responses:
        "200": {description: Skills, content: {application/json: {schema: {$ref: "#/components/schemas/SkillList"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: registerSkill
      summary: Register an imported Skill artifact
      tags: [Skills]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/RegisterSkillRequest"}}}
      responses:
        "201": {description: Skill registered, content: {application/json: {schema: {$ref: "#/components/schemas/Skill"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /skills/{skill_id}:
    get:
      operationId: getSkill
      summary: Inspect one imported Skill artifact
      tags: [Skills]
      parameters: [{name: skill_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Skill artifact, content: {application/json: {schema: {$ref: "#/components/schemas/Skill"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /skills/{skill_id}/usage:
    get:
      operationId: listSkillUsage
      summary: List Agent drafts and revisions using a Skill artifact
      tags: [Skills]
      parameters: [{name: skill_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Skill usage, content: {application/json: {schema: {$ref: "#/components/schemas/AssetUsageList"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /plugins:
    get:
      operationId: listPlugins
      summary: List organization Plugin versions
      tags: [Plugins]
      responses:
        "200": {description: Plugins, content: {application/json: {schema: {$ref: "#/components/schemas/PluginList"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: registerPlugin
      summary: Register an organization Plugin version
      tags: [Plugins]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/RegisterPluginRequest"}}}
      responses:
        "201": {description: Plugin registered, content: {application/json: {schema: {$ref: "#/components/schemas/Plugin"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /plugins/{plugin_id}:
    get:
      operationId: getPlugin
      summary: Inspect a Plugin version and workspace enablement
      tags: [Plugins]
      parameters: [{name: plugin_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Plugin detail, content: {application/json: {schema: {$ref: "#/components/schemas/PluginDetail"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /plugins/{plugin_id}/usage:
    get:
      operationId: listPluginUsage
      summary: List Agent drafts and revisions using a Plugin version
      tags: [Plugins]
      parameters: [{name: plugin_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Plugin usage, content: {application/json: {schema: {$ref: "#/components/schemas/AssetUsageList"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /tools:
    get:
      operationId: listTools
      summary: List active Tool descriptors
      tags: [Tools]
      responses:
        "200": {description: Tools, content: {application/json: {schema: {$ref: "#/components/schemas/ToolList"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      operationId: registerTool
      summary: Register a Tool server and descriptor version
      tags: [Tools]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/RegisterToolRequest"}}}
      responses:
        "201": {description: Tool registered, content: {application/json: {schema: {$ref: "#/components/schemas/Tool"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /tools/{tool_id}:
    get:
      operationId: getTool
      summary: Inspect a Tool descriptor, server, and input schema
      tags: [Tools]
      parameters: [{name: tool_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Tool descriptor, content: {application/json: {schema: {$ref: "#/components/schemas/Tool"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /tools/{tool_id}/usage:
    get:
      operationId: listToolUsage
      summary: List Agent drafts and revisions using a Tool descriptor
      tags: [Tools]
      parameters: [{name: tool_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Tool usage, content: {application/json: {schema: {$ref: "#/components/schemas/AssetUsageList"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /plugins/{plugin_id}/enable:
    post:
      operationId: enablePluginForWorkspace
      summary: Enable one active Plugin version in a workspace
      tags: [Plugins]
      parameters:
        - name: plugin_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/EnablePluginRequest"}}}
      responses:
        "204": {description: Plugin enabled}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /skills/{skill_id}:activate:
    post:
      operationId: activateSkill
      summary: Activate an imported Skill artifact
      tags: [Skills]
      parameters:
        - name: skill_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: "#/components/schemas/AssetStatusRequest"}}}
      responses:
        "204": {description: Skill activated}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /skills/{skill_id}:deprecate:
    post:
      operationId: deprecateSkill
      summary: Deprecate an imported Skill artifact
      tags: [Skills]
      parameters: [{name: skill_id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: "#/components/schemas/AssetStatusRequest"}}}
      responses:
        "204": {description: Skill deprecated}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /skills/{skill_id}:retire:
    post:
      operationId: retireSkill
      summary: Retire an imported Skill artifact
      tags: [Skills]
      parameters: [{name: skill_id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: "#/components/schemas/AssetStatusRequest"}}}
      responses:
        "204": {description: Skill retired}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /plugins/{plugin_id}:activate:
    post:
      operationId: activatePlugin
      summary: Activate an installed Plugin version
      tags: [Plugins]
      parameters: [{name: plugin_id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: "#/components/schemas/AssetStatusRequest"}}}
      responses:
        "204": {description: Plugin activated}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /plugins/{plugin_id}:deprecate:
    post:
      operationId: deprecatePlugin
      summary: Deprecate an installed Plugin version
      tags: [Plugins]
      parameters: [{name: plugin_id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: "#/components/schemas/AssetStatusRequest"}}}
      responses:
        "204": {description: Plugin deprecated}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /plugins/{plugin_id}:retire:
    post:
      operationId: retirePlugin
      summary: Retire an installed Plugin version
      tags: [Plugins]
      parameters: [{name: plugin_id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: "#/components/schemas/AssetStatusRequest"}}}
      responses:
        "204": {description: Plugin retired}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /tools/{tool_id}:activate:
    post:
      operationId: activateTool
      summary: Activate a proposed Tool descriptor
      tags: [Tools]
      parameters: [{name: tool_id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: "#/components/schemas/AssetStatusRequest"}}}
      responses:
        "204": {description: Tool activated}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /tools/{tool_id}:deprecate:
    post:
      operationId: deprecateTool
      summary: Deprecate a Tool descriptor
      tags: [Tools]
      parameters: [{name: tool_id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: "#/components/schemas/AssetStatusRequest"}}}
      responses:
        "204": {description: Tool deprecated}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /tools/{tool_id}:retire:
    post:
      operationId: retireTool
      summary: Retire a Tool descriptor
      tags: [Tools]
      parameters: [{name: tool_id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: false
        content: {application/json: {schema: {$ref: "#/components/schemas/AssetStatusRequest"}}}
      responses:
        "204": {description: Tool retired}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /agents/{agent_id}:
    get:
      operationId: getAgent
      summary: Get an agent in the current administrator domain
      tags: [Agents]
      parameters: [{$ref: "#/components/parameters/AgentId"}]
      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Agent"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /agents/{agent_id}/draft:
    get:
      operationId: getAgentDraft
      summary: Get the editable current draft
      tags: [Drafts]
      parameters: [{$ref: "#/components/parameters/AgentId"}]
      responses:
        "200":
          description: Draft
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentDraft"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    put:
      operationId: updateAgentDraft
      summary: Replace an agent draft with optimistic concurrency
      tags: [Drafts]
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateDraftRequest"}
      responses:
        "200":
          description: Updated draft
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentDraft"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "412": {$ref: "#/components/responses/RevisionConflict"}
        "422": {$ref: "#/components/responses/InvalidInput"}
  /agents/{agent_id}/versions:
    get:
      operationId: listAgentVersions
      summary: List immutable versions
      tags: [Versions]
      parameters: [{$ref: "#/components/parameters/AgentId"}]
      responses:
        "200":
          description: Version history
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentVersionList"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /agents/{agent_id}/review:
    get:
      operationId: getAgentReview
      summary: Get the current draft review and semantic diff
      tags: [Reviews]
      parameters: [{$ref: "#/components/parameters/AgentId"}]
      responses:
        "200":
          description: Current review state
          content: {application/json: {schema: {$ref: "#/components/schemas/AgentReview"}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /agents/{agent_id}:publish:
    post:
      operationId: publishAgentDraft
      summary: Freeze and publish the current valid draft
      tags: [Publications]
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Version from an idempotent publication retry
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentVersion"}
        "201":
          description: Published immutable version
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentVersion"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/InvalidState"}
        "412": {$ref: "#/components/responses/RevisionConflict"}
  /agents/{agent_id}:review:
    post:
      operationId: submitAgentReview
      summary: Submit the current draft for review
      tags: [Reviews]
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/SubmitReviewRequest"}}}
      responses:
        "201":
          description: Review submitted
          content: {application/json: {schema: {$ref: "#/components/schemas/AgentReview"}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/InvalidState"}
        "412": {$ref: "#/components/responses/RevisionConflict"}
  /agents/{agent_id}:review-decision:
    post:
      operationId: decideAgentReview
      summary: Approve or reject the current draft review
      tags: [Reviews]
      parameters: [{$ref: "#/components/parameters/AgentId"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ReviewDecisionRequest"}}}
      responses:
        "200":
          description: Review decision recorded
          content: {application/json: {schema: {$ref: "#/components/schemas/AgentReview"}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/InvalidState"}
  /agents/{agent_id}:retire:
    post:
      operationId: retireAgent
      summary: Retire the currently published agent
      tags: [Publications]
      parameters: [{$ref: "#/components/parameters/AgentId"}]
      responses:
        "204": {description: Agent retired}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/InvalidState"}
  /agents/{agent_id}:rollback:
    post:
      operationId: rollbackAgent
      summary: Roll back to an immutable published version
      tags: [Publications]
      parameters: [{$ref: "#/components/parameters/AgentId"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/RollbackRequest"}}}
      responses:
        "204": {description: Agent rolled back}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/InvalidState"}
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          scopes: {admin: Administrative agent lifecycle access}
  parameters:
    AgentId:
      name: agent_id
      in: path
      required: true
      schema: {type: string}
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string}
      description: Current draft revision.
  responses:
    Unauthorized:
      description: Authentication is required.
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
    Forbidden:
      description: Administrative access is required.
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
    NotFound:
      description: Resource was not found.
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
    InvalidInput:
      description: Request is invalid.
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
    InvalidState:
      description: Operation is not permitted in the current state.
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
    RevisionConflict:
      description: Draft revision is stale.
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
    PageInfo:
      type: object
      required: [has_more]
      properties:
        has_more: {type: boolean}
    Workspace:
      type: object
      required: [id, slug, display_name]
      properties:
        id: {type: string}
        slug: {type: string}
        display_name: {type: string}
    WorkspaceList:
      type: object
      required: [items, page_info]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Workspace"}}
        page_info: {$ref: "#/components/schemas/PageInfo"}
    Skill:
      type: object
      required: [id, workspace_id, slug, display_name, description, source_type, source_ref, declared_version, content_digest, status]
      properties:
        id: {type: string}
        workspace_id: {type: string}
        slug: {type: string}
        display_name: {type: string}
        description: {type: string}
        source_type: {type: string, enum: [marketplace, locator, upload, local]}
        source_ref: {type: string}
        declared_version: {type: string}
        content_digest: {type: string}
        status: {type: string, enum: [available, deprecated, retired]}
    SkillList:
      type: object
      required: [items, page_info]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Skill"}}
        page_info: {$ref: "#/components/schemas/PageInfo"}
    AssetUsage:
      type: object
      required: [agent_id, agent_name, workspace_id, reference_kind, reference_index]
      properties:
        agent_id: {type: string}
        agent_name: {type: string}
        workspace_id: {type: string}
        reference_kind: {type: string, enum: [draft, revision]}
        reference_index: {type: integer}
    AssetUsageList:
      type: object
      required: [items, page_info]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/AssetUsage"}}
        page_info: {$ref: "#/components/schemas/PageInfo"}
    RegisterSkillRequest:
      type: object
      required: [workspace_id, slug, display_name, source_type, source_ref, content_digest]
      properties:
        workspace_id: {type: string}
        slug: {type: string}
        display_name: {type: string}
        description: {type: string}
        source_type: {type: string, enum: [marketplace, locator, upload, local]}
        source_ref: {type: string}
        declared_version: {type: string}
        content_digest: {type: string}
    Plugin:
      type: object
      required: [id, slug, display_name, description, version, content_digest, status]
      properties:
        id: {type: string}
        slug: {type: string}
        display_name: {type: string}
        description: {type: string}
        version: {type: string}
        content_digest: {type: string}
        status: {type: string, enum: [active, deprecated, retired]}
    PluginList:
      type: object
      required: [items, page_info]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Plugin"}}
        page_info: {$ref: "#/components/schemas/PageInfo"}

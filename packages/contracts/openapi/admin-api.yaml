      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/UpsertLimitPolicyRequest"}}}}
      responses: {"200": {description: Limit policy, content: {application/json: {schema: {$ref: "#/components/schemas/LimitPolicy"}}}}, "409": {$ref: "#/components/responses/Conflict"}}
  /platform/environment-profiles:
    get:
      operationId: listPlatformEnvironmentProfiles
      summary: List organization and workspace environment profiles
      tags: [Platform]
      parameters:
        - {name: workspace_id, in: query, schema: {type: string}}

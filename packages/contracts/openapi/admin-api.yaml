      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SettingsApplyRequest"}}}}
      responses: {"200": {description: Validation result, content: {application/json: {schema: {$ref: "#/components/schemas/SettingsValidation"}}}}}
  /platform/settings:apply:
    post:
      operationId: applyPlatformSettings
      summary: Apply a settings section with ETag protection
      tags: [Platform]
      parameters:
        - {$ref: "#/components/parameters/IfMatch"}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SettingsApplyRequest"}}}}
      responses: {"200": {description: Updated settings projection, content: {application/json: {schema: {$ref: "#/components/schemas/PlatformSettingsProjection"}}}}, "409": {$ref: "#/components/responses/Conflict"}}

components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          scopes: {admin: Administrative agent lifecycle access}
  parameters:
    AgentId:
      name: agent_id
      in: path
      required: true
      schema: {type: string}
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string}
      description: Current named Draft working-copy ETag.
  responses:
    Unauthorized:
      description: Authentication is required.
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
    Forbidden:
      description: Administrative access is required.
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
    NotFound:
      description: Resource was not found.
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
    InvalidRequest:
      description: Request syntax or query parameters are invalid.
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
    InvalidInput:
      description: Request is invalid.
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
    InvalidState:
      description: Operation is not permitted in the current state.
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
    ServiceUnavailable:
      description: Required storage or infrastructure is unavailable.
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
    RevisionConflict:
      description: Draft revision is stale.
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
    Conflict:
      description: Command precondition or idempotency conflict.
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorResponse"}}}
  schemas:
    EvaluationSuite:
      type: object
      required: [id, organization_id, workspace_id, name, state, owner_principal_id, gate_usage_count, etag]
      properties:
        id: {type: string}
        organization_id: {type: string}
        workspace_id: {type: string}
        name: {type: string}
        state: {type: string, enum: [draft, published, retired]}
        owner_principal_id: {type: string}
        latest_version_id: {type: string, nullable: true}
        gate_usage_count: {type: integer, minimum: 0}
        etag: {type: string}
    EvaluationSuiteList:
      type: object
      required: [items, page_info]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/EvaluationSuite"}}
        page_info: {$ref: "#/components/schemas/PolicyPageInfo"}
    CreateEvaluationSuiteRequest:
      type: object
      required: [workspace_id, name]
      properties:
        workspace_id: {type: string}
        name: {type: string}
    PatchEvaluationSuiteRequest:
      type: object
      required: [name]
      properties:
        name: {type: string}
    EvaluationCase:
      type: object
      required: [id, suite_id, input, fixture_manifest, assertions, compatibility, etag]
      properties:
        id: {type: string}
        suite_id: {type: string}
        input: {type: object, additionalProperties: true}
        fixture_manifest: {type: object, additionalProperties: true}
        assertions: {type: array, items: {type: object, additionalProperties: true}}
        rubric: {type: object, nullable: true, additionalProperties: true}
        compatibility: {type: object, additionalProperties: true}
        etag: {type: string}
    EvaluationCaseList:
      type: object
      required: [items, page_info]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/EvaluationCase"}}
        page_info: {$ref: "#/components/schemas/PolicyPageInfo"}
    CreateEvaluationCaseRequest:
      type: object
      required: [input, fixture_manifest, assertions]
      properties:
        input: {type: object, additionalProperties: true}
        fixture_manifest: {type: object, additionalProperties: true}
        assertions: {type: array, items: {type: object, additionalProperties: true}}
        rubric: {type: object, nullable: true, additionalProperties: true}
        compatibility: {type: object, additionalProperties: true}
    EvaluationValidation:
      type: object
      required: [state, findings]
      properties:
        state: {type: string, enum: [valid, invalid, pending]}
        findings: {type: array, items: {type: object, additionalProperties: true}}
    EvaluationSuiteVersion:
      type: object
      required: [id, suite_id, content_digest, case_manifest_digest, fixture_manifest_digest, runtime_image_digest, published_at]
      properties:
        id: {type: string}
        suite_id: {type: string}
        content_digest: {type: string}
        case_manifest_digest: {type: string}
        fixture_manifest_digest: {type: string}
        evaluator_policy_version_id: {type: string}
        runtime_image_digest: {type: string}
        published_at: {type: string, format: date-time}
    EvaluationSuiteVersionList:
      type: object
      required: [items, page_info]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/EvaluationSuiteVersion"}}
        page_info: {$ref: "#/components/schemas/PolicyPageInfo"}
    PublishEvaluationVersionRequest:
      type: object
      required: [runtime_image_digest]
      properties:
        evaluator_policy_version_id: {type: string}
        runtime_image_digest: {type: string}
    EvaluationRun:
      type: object
      required: [id, suite_version_id, candidate_revision_hash, environment_digest, state, gate_result, deterministic_summary, created_at]
      properties:
        id: {type: string}
        suite_version_id: {type: string}
        candidate_revision_hash: {type: string}
        baseline_revision_hash: {type: string, nullable: true}
        environment_digest: {type: string}
        state: {type: string, enum: [requested, queued, provisioning, running, completed, failed, canceled, invalid]}
        gate_result: {type: string, enum: [not_applicable, passed, failed, blocked, invalid]}
        deterministic_summary: {type: object, additionalProperties: true}
        probabilistic_summary: {type: object, nullable: true, additionalProperties: true}
        evidence_manifest_digest: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
    EvaluationRunList:
      type: object
      required: [items, page_info]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/EvaluationRun"}}
        page_info: {$ref: "#/components/schemas/PolicyPageInfo"}
    CreateEvaluationRunRequest:
      type: object
      required: [suite_version_id, candidate_revision_hash, environment_digest]
      properties:
        suite_version_id: {type: string}
        candidate_revision_hash: {type: string}
        baseline_revision_hash: {type: string, nullable: true}
        environment_digest: {type: string}
    EvaluationGate:
      type: object
      required: [id, agent_revision_hash, suite_version_id, requirement, state]
      properties:
        id: {type: string}
        agent_revision_hash: {type: string}
        suite_version_id: {type: string}
        requirement: {type: object, additionalProperties: true}
        state: {type: string, enum: [required, passed, failed, overridden, expired]}
        override_id: {type: string, nullable: true}
    EvaluationGateList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/EvaluationGate"}}
    OverrideEvaluationGateRequest:
      type: object
      required: [reason, expires_at]
      properties:
        reason: {type: string, minLength: 1}
        expires_at: {type: string, format: date-time}
    EvaluationRegression:
      type: object
      required: [kind, severity, message, candidate_evidence, baseline_evidence]
      properties:
        kind: {type: string, enum: [deterministic, policy, side_effect, quality, latency, cost, fixture, environment]}
        severity: {type: string, enum: [low, medium, high, critical]}
        case_id: {type: string}
        message: {type: string}
        candidate_evidence: {type: object, additionalProperties: true}
        baseline_evidence: {type: object, additionalProperties: true}
    EvaluationRegressionList:
      type: object
      required: [comparison_state, items]
      properties:
        comparison_state: {type: string, enum: [pending, comparable, invalid]}
        items: {type: array, items: {$ref: "#/components/schemas/EvaluationRegression"}}
    Policy:
      type: object
      required: [id, organization_id, type, name, state, schema_version, draft_etag, active_binding_count]
      properties:
        id: {type: string}
        organization_id: {type: string}
        workspace_id: {type: string, nullable: true}
        type: {type: string, enum: [approval, model, tool, command, network, credential, data, budget, retention, evaluation, publication]}
        name: {type: string}
        owner_principal_id: {type: string}
        state: {type: string, enum: [draft, published, retired]}
        schema_version: {type: string}
        draft_etag: {type: string}
        latest_version_id: {type: string, nullable: true}
        active_binding_count: {type: integer, minimum: 0}
    PolicyList:
      type: object
      required: [items, page_info]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/Policy"}}
        page_info: {$ref: "#/components/schemas/PolicyPageInfo"}
    PolicyPageInfo:
      type: object
      required: [next_cursor]
      properties:
        next_cursor: {type: string, nullable: true}
    ValidationResult:
      type: object
      required: [state, findings]
      properties:
        state: {type: string, enum: [valid, invalid, pending]}
        findings: {type: array, items: {type: object, additionalProperties: true}}
    PolicyDraft:
      type: object
      required: [policy_id, document, schema_version, etag, validation]
      properties:
        policy_id: {type: string}
        document: {type: object, additionalProperties: true}
        schema_version: {type: string}
        etag: {type: string}
        validation: {$ref: "#/components/schemas/ValidationResult"}
    CreatePolicyRequest:
      type: object
      required: [type, name, document]
      properties:
        workspace_id: {type: string}
        type: {type: string, enum: [approval, model, tool, command, network, credential, data, budget, retention, evaluation, publication]}
        name: {type: string}
        schema_version: {type: string}
        document: {type: object, additionalProperties: true}
    CreatedPolicy:
      type: object
      required: [policy, draft]
      properties:
        policy: {$ref: "#/components/schemas/Policy"}
        draft: {$ref: "#/components/schemas/PolicyDraft"}
    UpdatePolicyDraftRequest:
      type: object
      required: [document]
      properties:
        schema_version: {type: string}
        document: {type: object, additionalProperties: true}
    PublishPolicyRequest:
      type: object
      required: [message]
      properties:
        message: {type: string, minLength: 1}
    PolicyVersion:
      type: object
      required: [id, policy_id, content_digest, schema_version, message, document, compiler_evidence, created_by, created_at]
      properties:
        id: {type: string}
        policy_id: {type: string}
        content_digest: {type: string}
        schema_version: {type: string}
        message: {type: string}
        document: {type: object, additionalProperties: true}
        compiler_evidence: {type: object, additionalProperties: true}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
    PolicyVersionList:
      type: object
      required: [items, page_info]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/PolicyVersion"}}
        page_info: {$ref: "#/components/schemas/PolicyPageInfo"}
    PolicyScopeRef:
      type: object
      required: [organization_id, scope]
      properties:
        organization_id: {type: string}
        workspace_id: {type: string, nullable: true}
        scope: {type: string, enum: [organization, workspace]}
    PolicyBinding:
      type: object
      required: [id, version_id, target, environment, state, effective_from, reason]
      properties:
        id: {type: string}
        version_id: {type: string}
        target: {$ref: "#/components/schemas/PolicyScopeRef"}
        target_resource_id: {type: string, nullable: true}
        environment: {type: string, enum: [development, staging, production]}
        state: {type: string, enum: [pending, active, expired, revoked]}
        effective_from: {type: string, format: date-time}
        effective_until: {type: string, format: date-time, nullable: true}
        reason: {type: string}
    PolicyBindingList:
      type: object
      required: [items, page_info]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/PolicyBinding"}}
        page_info: {$ref: "#/components/schemas/PolicyPageInfo"}
    BindPolicyRequest:
      type: object
      required: [version_id, scope, environment]
      properties:

$schema: 'https://moonrepo.dev/schemas/project.json'

layer: library
language: other

tags:
  - proto
  - contracts

tasks:
  generate:
    command: 'buf generate --template proto/buf.gen.yaml proto'
    type: 'run'
    options:
      runInCI: true
      runFromWorkspaceRoot: true
    inputs:
      - 'gantry/**/*.proto'
      - 'buf.gen.yaml'
      - 'buf.yaml'
  lint:
    command: 'buf lint proto'
    type: 'test'
    options:
      runFromWorkspaceRoot: true
  breaking:
    command: 'buf breaking proto --against ".git#branch=main,subdir=proto"'
    type: 'test'
    options:
      runFromWorkspaceRoot: true

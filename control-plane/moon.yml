$schema: 'https://moonrepo.dev/schemas/project.json'
layer: 'application'
language: 'go'
tags: ['backend']
tasks:
  build:
    command: 'go build -o bin/gantry ./cmd/gantry'
    deps:
      - 'proto:generate'
    type: 'build'
    toolchains: 'system'
  test:
    command: 'go test ./...'
    deps:
      - 'proto:generate'
    type: 'test'
    toolchains: 'system'
  run:
    command: 'go run ./cmd/gantry'
    deps:
      - 'proto:generate'
    type: 'run'
    toolchains: 'system'
    preset: 'server'

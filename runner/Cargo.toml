[workspace]
members = [
  "crates/runner",
  "crates/protocol",
  "crates/pty-handler",
  "crates/mcp-client",
  "crates/policy-enforcement",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"
prost-types = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
aes-gcm = "0.10"
bytes = "1"
futures-util = "0.3"
globset = "0.4"
ignore = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

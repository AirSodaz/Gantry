$schema: 'https://moonrepo.dev/schemas/project.json'
layer: 'application'
language: 'rust'
tags: ['backend', 'runner']
tasks:
  build:
    command: 'cargo build'
    deps:
      - 'proto:generate'
    type: 'build'
    toolchains: 'system'
  test:
    command: 'cargo test'
    deps:
      - 'proto:generate'
    type: 'test'
    toolchains: 'system'
  run:
    command: 'cargo run --bin runner'
    deps:
      - 'proto:generate'
    type: 'run'
    toolchains: 'system'
    preset: 'server'
